name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发写坏环境
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 固定到当前 LTS。GitHub 已在弃用 Node 20 运行时，
          # 不显式指定会随 runner 默认值漂移（曾因此触发弃用警告）。
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # 后端跑在家里那台机器上（Go 服务），前端在 GitHub Pages，两者跨域，
        # 所以必须显式指定地址；留空会走相对路径，线上会 404。
        #
        # 注意这是**构建期**变量：改了它必须重新部署 Pages。
        # 后端那边的上游地址、缓存 TTL、限流阈值都在 server/server.yaml 里，
        # 改那些不需要重新构建前端。
        env:
          VITE_API_BASE: https://mc.tbpdt.top:9983
        run: npm run build

      # ⚠️ 前提：仓库必须先在 Settings → Pages → Source 里选 "GitHub Actions"。
      # 否则本步骤会报 "Get Pages site failed ... Not Found"。
      #
      # 这里刻意**不加** enablement: true —— 官方 action 文档明确写着
      # "This option requires a token other than GITHUB_TOKEN to be provided"，
      # 默认的 GITHUB_TOKEN 权限不足，加了只会把 404 变成 403。
      # 手动开启一次即可，属于一次性配置。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
